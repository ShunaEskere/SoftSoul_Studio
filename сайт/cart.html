<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Корзина</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="modern-header"><div class="logo" onclick="location.href='Main.html'">SoftSoul Studio</div></header>
    <div id="cartList" style="max-width:800px; margin:50px auto; background:white; padding:30px; border-radius:20px;"></div>
    <script>
        let user = localStorage.getItem('currentUser');
        if(!user) location.href='Main.html';
        let u = JSON.parse(user);
        let cart = JSON.parse(localStorage.getItem('cart_'+u.id)||'[]');
        let products = {
            1: {name:"Awax Demon Friend Hoodie", price:5000, img:"images/Awax Demon Friend Hoodie.jpg"},
            2: {name:"Evil Eye Skeleton Hoodie", price:6000, img:"images/Evil Eye Skeleton Hoodie.jpg"}
        };
        let html = '<h2>Корзина</h2>';
        let total = 0;
        for(let item of cart){
            let p = products[item.id];
            if(p){
                html += `<div><img src="${p.img}" width="50"> ${p.name} x ${item.q} = ${p.price*item.q} руб. <button onclick="remove(${item.id})">Удалить</button></div>`;
                total += p.price * item.q;
            }
        }
        html += `<h3>Итого: ${total} руб.</h3><button onclick="checkout()">Оформить</button>`;
        document.getElementById('cartList').innerHTML = html;
        function remove(id){
            let newCart = cart.filter(i=>i.id!==id);
            localStorage.setItem('cart_'+u.id, JSON.stringify(newCart));
            location.reload();
        }
        function checkout(){ alert("Заказ оформлен! Спасибо."); localStorage.setItem('cart_'+u.id,'[]'); location.reload(); }
    </script>
</body>
</html>
