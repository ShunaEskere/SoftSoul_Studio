<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SoftSoul Studio</title>
    <style>
        body { font-family: Arial; background: linear-gradient(135deg, #0f0c29, #302b63); color: white; text-align: center; padding: 50px; }
        input, button { padding: 10px; margin: 10px; border-radius: 10px; border: none; }
        button { background: #667eea; color: white; cursor: pointer; }
        .product { background: white; color: black; display: inline-block; margin: 10px; padding: 15px; border-radius: 15px; width: 250px; }
    </style>
</head>
<body>

<h1>SoftSoul Studio</h1>

<div id="auth">
    <input type="text" id="name" placeholder="Имя или Email">
    <input type="password" id="pass" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <button onclick="register()">Регистрация</button>
</div>

<div id="userInfo" style="display:none">
    <span id="userNameDisplay"></span>
    <button onclick="logout()">Выйти</button>
    <a href="admin.html" id="adminLink" style="display:none">Админ панель</a>
</div>

<h2>Каталог</h2>
<div id="products"></div>

<script>
    // Товары
    const products = [
        { id: 1, name: "Awax Demon Friend Hoodie", price: 5000 },
        { id: 2, name: "Evil Eye Skeleton Hoodie", price: 6000 }
    ];

    function showProducts() {
        let html = '';
        products.forEach(p => {
            html += `<div class="product">
                        <h3>${p.name}</h3>
                        <p>${p.price} руб.</p>
                        <button onclick="addToCart(${p.id})">В корзину</button>
                    </div>`;
        });
        document.getElementById('products').innerHTML = html;
    }

    function addToCart(id) {
        let user = localStorage.getItem('currentUser');
        if (!user) { alert("Сначала войдите"); return; }
        let userId = JSON.parse(user).id;
        let cart = JSON.parse(localStorage.getItem('cart_' + userId) || '[]');
        cart.push(id);
        localStorage.setItem('cart_' + userId, JSON.stringify(cart));
        alert("Товар добавлен в корзину!");
    }

    function register() {
        let name = document.getElementById('name').value;
        let pass = document.getElementById('pass').value;
        if (!name || !pass) { alert("Заполните поля"); return; }
        let users = JSON.parse(localStorage.getItem('users') || '[]');
        if (users.find(u => u.name === name)) { alert("Пользователь уже есть"); return; }
        let newUser = { id: Date.now(), name: name, password: pass, isAdmin: name === 'admin' };
        users.push(newUser);
        localStorage.setItem('users', JSON.stringify(users));
        localStorage.setItem('currentUser', JSON.stringify(newUser));
        alert("Регистрация успешна!");
        location.reload();
    }

    function login() {
        let name = document.getElementById('name').value;
        let pass = document.getElementById('pass').value;
        let users = JSON.parse(localStorage.getItem('users') || '[]');
        let user = users.find(u => u.name === name && u.password === pass);
        if (!user) { alert("Неверно"); return; }
        localStorage.setItem('currentUser', JSON.stringify(user));
        alert("Добро пожаловать, " + user.name);
        location.reload();
    }

    function logout() {
        localStorage.removeItem('currentUser');
        location.reload();
    }

    function checkAuth() {
        let user = localStorage.getItem('currentUser');
        if (user) {
            let u = JSON.parse(user);
            document.getElementById('auth').style.display = 'none';
            document.getElementById('userInfo').style.display = 'block';
            document.getElementById('userNameDisplay').innerText = u.name;
            if (u.name === 'admin') document.getElementById('adminLink').style.display = 'inline';
        }
    }

    showProducts();
    checkAuth();
</script>

</body>
</html>
