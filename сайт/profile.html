<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoftSoul Studio - Профиль</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .profile-header { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; display: flex; align-items: center; gap: 30px; margin-bottom: 30px; }
        .profile-avatar { width: 100px; height: 100px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 50px; color: white; }
        .profile-info h1 { color: white; font-size: 28px; margin-bottom: 8px; }
        .profile-info p { color: rgba(255,255,255,0.8); }
        .action-card { background: rgba(255,255,255,0.95); border-radius: 15px; padding: 20px; display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .action-icon { width: 50px; height: 50px; background: rgba(102,126,234,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #667eea; }
        .action-card.danger .action-icon { background: rgba(244,67,54,0.1); color: #f44336; }
        .action-info { flex: 1; }
        .action-info h4 { color: #333; margin-bottom: 5px; }
        .action-info p { color: #666; font-size: 13px; }
        .modern-btn { padding: 10px 25px; border-radius: 25px; font-weight: 600; cursor: pointer; border: none; }
        .modern-btn.outline { background: transparent; border: 2px solid #667eea; color: #667eea; }
        .modern-btn.danger { background: #f44336; color: white; }
        @media (max-width: 768px) {
            .profile-header { flex-direction: column; text-align: center; }
            .action-card { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="bg-animation" id="bgAnimation"></div>
    
    <header class="modern-header">
        <div class="logo" onclick="window.location.href='Main.html'"><img src="images/Лого VIBE.png" alt="SoftSoul Studio"></div>
        <a href="Main.html" class="back-button"><i class="fas fa-arrow-left"></i> На главную</a>
        <div class="user-panel" id="userPanel"></div>
    </header>

    <div class="profile-container">
        <div class="profile-header">
            <div class="profile-avatar"><i class="fas fa-user-circle"></i></div>
            <div class="profile-info">
                <h1 id="profileName">Загрузка...</h1>
                <p id="profileEmail">загрузка...</p>
            </div>
        </div>
        
        <div class="action-card">
            <div class="action-icon"><i class="fas fa-sign-out-alt"></i></div>
            <div class="action-info"><h4>Выход из аккаунта</h4><p>Выйдите из текущей сессии.</p></div>
            <button class="modern-btn outline" onclick="logout()">Выйти</button>
        </div>
        
        <div class="action-card danger">
            <div class="action-icon"><i class="fas fa-trash-alt"></i></div>
            <div class="action-info"><h4>Удалить аккаунт</h4><p>Внимание! Это действие необратимо.</p></div>
            <button class="modern-btn danger" onclick="deleteAccount()">Удалить аккаунт</button>
        </div>
    </div>

    <script>
        function showToast(message, type) {
            var existing = document.querySelector('.custom-toast');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'custom-toast';
            var icon = type === 'success' ? '<i class="fas fa-check-circle"></i>' : '<i class="fas fa-exclamation-circle"></i>';
            toast.innerHTML = '<div class="toast-content ' + type + '">' + icon + '<div class="toast-message">' + message + '</div></div>';
            document.body.appendChild(toast);
            setTimeout(function() { if (toast) toast.remove(); }, 3000);
        }
        
        var user = localStorage.getItem('currentUser');
        if (!user) {
            window.location.href = 'Main.html';
        } else {
            var userData = JSON.parse(user);
            document.getElementById('profileName').textContent = userData.name;
            document.getElementById('profileEmail').textContent = userData.email;
        }
        
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'Main.html';
        }
        
        function deleteAccount() {
            if (confirm('Вы уверены, что хотите удалить аккаунт? Это действие необратимо.')) {
                var userId = JSON.parse(localStorage.getItem('currentUser')).id;
                var allUsers = JSON.parse(localStorage.getItem('allUsers') || '[]');
                var newUsers = allUsers.filter(function(u) { return u.id !== userId; });
                localStorage.setItem('allUsers', JSON.stringify(newUsers));
                localStorage.removeItem('currentUser');
                localStorage.removeItem('cart_' + userId);
                localStorage.removeItem('favorites_' + userId);
                showToast('Аккаунт удалён', 'success');
                setTimeout(function() { window.location.href = 'Main.html'; }, 1500);
            }
        }
    </script>
</body>
</html>
