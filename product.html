<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoftSoul Studio - Товар</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', 'Inter', sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; pointer-events: none; }
        .bg-animation span { position: absolute; display: block; width: 20px; height: 20px; background: rgba(255,255,255,0.08); bottom: -150px; animation: floatUp 8s infinite; border-radius: 50%; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 10% { opacity: 0.5; } 100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; } }
        .modern-header { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo img { height: 50px; cursor: pointer; }
        .back-button { color: #667eea; text-decoration: none; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .user-panel { display: flex; gap: 20px; align-items: center; }
        .user-icon, .cart-icon, .favorite-icon { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; position: relative; }
        .cart-count { position: absolute; top: -8px; right: -8px; background: #ff6b6b; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        .admin-btn { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #f44336, #d32f2f); color: white; padding: 8px 20px; border-radius: 30px; text-decoration: none; font-size: 14px; margin-left: 10px; }
        .product-container { max-width: 1200px; margin: 50px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 50px; background: white; border-radius: 30px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .product-gallery { padding: 40px; background: #f9f9f9; }
        .main-image { width: 100%; height: 400px; object-fit: contain; border-radius: 20px; background: white; padding: 20px; cursor: pointer; }
        .thumbnail-list { display: flex; gap: 15px; margin-top: 20px; justify-content: center; flex-wrap: wrap; }
        .thumbnail { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; cursor: pointer; border: 2px solid transparent; transition: all 0.3s; }
        .thumbnail.active { border-color: #667eea; transform: scale(1.05); }
        .product-info { padding: 40px; }
        .product-title { font-size: 32px; color: #333; margin-bottom: 15px; }
        .product-price { font-size: 28px; font-weight: bold; color: #667eea; margin-bottom: 20px; }
        .product-description { color: #666; line-height: 1.6; margin-bottom: 25px; }
        .product-materials { background: #f5f5f5; padding: 15px; border-radius: 15px; margin-bottom: 25px; }
        .product-materials i { color: #667eea; margin-right: 10px; }
        .size-selector { margin-bottom: 25px; }
        .size-title { font-weight: 600; margin-bottom: 10px; color: #333; }
        .size-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
        .size-btn { width: 55px; height: 55px; border: 2px solid #e0e0e0; background: white; border-radius: 12px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .size-btn:hover { border-color: #667eea; }
        .size-btn.active { border-color: #667eea; background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .quantity-selector { margin-bottom: 30px; }
        .quantity-title { font-weight: 600; margin-bottom: 10px; color: #333; }
        .quantity-control { display: flex; align-items: center; gap: 15px; }
        .quantity-btn { width: 40px; height: 40px; border: 2px solid #e0e0e0; background: white; border-radius: 10px; cursor: pointer; font-size: 18px; }
        .quantity-input { width: 60px; height: 40px; text-align: center; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
        .add-to-cart-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: 700; font-size: 18px; transition: all 0.3s; margin-top: 10px; }
        .add-to-cart-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
        .reviews-section { max-width: 1200px; margin: 40px auto; background: white; border-radius: 30px; padding: 40px; }
        .reviews-title { font-size: 24px; color: #333; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .review-item { border-bottom: 1px solid #eee; padding: 20px 0; display: flex; gap: 20px; }
        .review-avatar { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; }
        .review-content { flex: 1; }
        .review-author { font-weight: 600; color: #333; }
        .review-rating { color: #ffc107; margin: 5px 0; }
        .review-text { color: #666; line-height: 1.5; }
        .review-date { font-size: 12px; color: #999; margin-top: 8px; }
        .add-review-form { background: #f9f9f9; border-radius: 20px; padding: 25px; margin-top: 30px; }
        .star-rating { display: flex; gap: 8px; margin-bottom: 15px; }
        .star { font-size: 28px; cursor: pointer; color: #ddd; transition: color 0.3s; }
        .star.active { color: #ffc107; }
        .modal-gallery { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; justify-content: center; align-items: center; }
        .modal-gallery.show { display: flex; }
        .modal-gallery img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .close-gallery { position: absolute; top: 20px; right: 35px; font-size: 40px; color: white; cursor: pointer; }
        .gallery-nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 50px; color: white; cursor: pointer; padding: 20px; }
        .gallery-nav.prev { left: 20px; }
        .gallery-nav.next { right: 20px; }
        @media (max-width: 768px) {
            .product-container { grid-template-columns: 1fr; margin: 20px; gap: 0; }
            .main-image { height: 280px; }
            .thumbnail { width: 60px; height: 60px; }
            .product-title { font-size: 24px; }
            .product-price { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="bg-animation" id="bgAnimation"></div>

    <header class="modern-header">
        <div class="logo" onclick="window.location.href='Main.html'">
            <img src="images/Лого VIBE.png" alt="SoftSoul Studio">
        </div>
        <a href="Main.html" class="back-button"><i class="fas fa-arrow-left"></i> На главную</a>
        <div class="user-panel" id="userPanel">
            <div class="user-icon" onclick="window.location.href='profile.html'"><i class="fas fa-user"></i></div>
            <div class="cart-icon" onclick="window.location.href='cart.html'"><i class="fas fa-shopping-bag"></i><span class="cart-count" id="cartCount">0</span></div>
            <a href="admin.html" class="admin-btn" id="adminBtn" style="display: none;"><i class="fas fa-cog"></i> Админ панель</a>
        </div>
    </header>

    <div class="product-container" id="productContainer">
        <div class="product-gallery">
            <img id="mainImage" class="main-image" src="" alt="Товар" onclick="openGallery()">
            <div class="thumbnail-list" id="thumbnailList"></div>
        </div>
        <div class="product-info">
            <h1 id="productTitle" class="product-title"></h1>
            <div id="productPrice" class="product-price"></div>
            <p id="productDescription" class="product-description"></p>
            <div id="productMaterials" class="product-materials"><i class="fas fa-palette"></i> <span></span></div>
            <div class="size-selector">
                <div class="size-title">Выберите размер:</div>
                <div class="size-buttons" id="sizeButtons"></div>
            </div>
            <div class="quantity-selector">
                <div class="quantity-title">Количество:</div>
                <div class="quantity-control">
                    <button class="quantity-btn" onclick="changeQuantity(-1)">-</button>
                    <input type="number" id="quantity" class="quantity-input" value="1" min="1" max="99">
                    <button class="quantity-btn" onclick="changeQuantity(1)">+</button>
                </div>
            </div>
            <button class="add-to-cart-btn" onclick="addToCart()"><i class="fas fa-shopping-bag"></i> Добавить в корзину</button>
        </div>
    </div>

    <div class="reviews-section" id="reviewsSection">
        <div class="reviews-title">
            <span><i class="fas fa-comments"></i> Отзывы покупателей</span>
            <button class="modern-btn outline" onclick="showReviewForm()">✍️ Написать отзыв</button>
        </div>
        <div id="reviewsList"></div>
        <div id="reviewForm" class="add-review-form" style="display: none;">
            <h4>Ваш отзыв</h4>
            <div class="star-rating" id="starRating"></div>
            <textarea id="reviewText" rows="4" style="width:100%; padding:12px; border-radius:12px; border:1px solid #ddd; margin-top:10px;" placeholder="Поделитесь впечатлениями о товаре..."></textarea>
            <button class="modern-btn primary" onclick="submitReview()" style="margin-top:15px;">Отправить отзыв</button>
        </div>
    </div>

    <!-- Модальная галерея -->
    <div id="galleryModal" class="modal-gallery">
        <span class="close-gallery" onclick="closeGallery()">&times;</span>
        <div class="gallery-nav prev" onclick="prevImage()">&#10094;</div>
        <img id="galleryImage" src="">
        <div class="gallery-nav next" onclick="nextImage()">&#10095;</div>
    </div>

    <script>
        let currentUser = null;
        let currentProduct = null;
        let selectedSize = null;
        let galleryImages = [];
        let currentImageIndex = 0;
        let currentRating = 0;

        function getProductId() {
            return new URLSearchParams(window.location.search).get('id');
        }

        // Загрузка товара из БД (через API)
        async function loadProduct() {
            const id = getProductId();
            if (!id) {
                window.location.href = 'Main.html';
                return;
            }
            
            try {
                const response = await fetch(`php/get_product.php?id=${id}`);
                const data = await response.json();
                
                if (data.success && data.product) {
                    currentProduct = data.product;
                    
                    // Собираем все непустые изображения
                    galleryImages = [];
                    if (currentProduct.image_front && currentProduct.image_front !== 'images/placeholder.jpg') 
                        galleryImages.push(currentProduct.image_front);
                    if (currentProduct.image_back) 
                        galleryImages.push(currentProduct.image_back);
                    if (currentProduct.image_model_front) 
                        galleryImages.push(currentProduct.image_model_front);
                    if (currentProduct.image_model_back) 
                        galleryImages.push(currentProduct.image_model_back);
                    
                    // Если нет ни одного изображения — ставим заглушку
                    if (galleryImages.length === 0) {
                        galleryImages.push('images/placeholder.jpg');
                    }
                    
                    displayProduct();
                    loadReviews();
                } else {
                    window.location.href = 'Main.html';
                }
            } catch(e) {
                console.error('Ошибка загрузки товара:', e);
                window.location.href = 'Main.html';
            }
        }
        
        function displayProduct() {
            document.getElementById('productTitle').innerText = currentProduct.name;
            document.getElementById('productPrice').innerText = Number(currentProduct.price).toLocaleString() + ' руб.';
            document.getElementById('productDescription').innerText = currentProduct.description || 'Уникальный дизайн с ручной росписью акриловыми красками.';
            document.getElementById('productMaterials').querySelector('span').innerHTML = 'Акриловые краски, высококачественные материалы.';
            document.getElementById('mainImage').src = galleryImages[0];
            
            // Миниатюры
            const thumbList = document.getElementById('thumbnailList');
            thumbList.innerHTML = '';
            galleryImages.forEach((img, idx) => {
                const thumb = document.createElement('img');
                thumb.src = img;
                thumb.className = 'thumbnail';
                if (idx === 0) thumb.classList.add('active');
                thumb.onclick = () => changeImage(idx);
                thumb.onerror = () => { thumb.src = 'images/placeholder.jpg'; };
                thumbList.appendChild(thumb);
            });
            
            // Размеры (из БД или стандартные)
            let sizes = ['XS', 'S', 'M', 'L', 'XL', 'XXL'];
            if (currentProduct.sizes) {
                sizes = currentProduct.sizes.split(',').map(s => s.trim());
            }
            const sizeContainer = document.getElementById('sizeButtons');
            sizeContainer.innerHTML = '';
            sizes.forEach(size => {
                const btn = document.createElement('button');
                btn.textContent = size;
                btn.className = 'size-btn';
                btn.onclick = () => selectSize(size, btn);
                sizeContainer.appendChild(btn);
            });
        }

        function changeImage(index) {
            currentImageIndex = index;
            document.getElementById('mainImage').src = galleryImages[index];
            document.querySelectorAll('.thumbnail').forEach((thumb, i) => {
                thumb.classList.toggle('active', i === index);
            });
        }

        function openGallery() {
            document.getElementById('galleryImage').src = galleryImages[currentImageIndex];
            document.getElementById('galleryModal').classList.add('show');
        }

        function closeGallery() {
            document.getElementById('galleryModal').classList.remove('show');
        }

        function prevImage() {
            currentImageIndex = (currentImageIndex - 1 + galleryImages.length) % galleryImages.length;
            document.getElementById('galleryImage').src = galleryImages[currentImageIndex];
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % galleryImages.length;
            document.getElementById('galleryImage').src = galleryImages[currentImageIndex];
        }

        function selectSize(size, btn) {
            selectedSize = size;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function changeQuantity(delta) {
            const input = document.getElementById('quantity');
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            if (val > 99) val = 99;
            input.value = val;
        }

        function addToCart() {
            if (!currentUser) { alert("Войдите в аккаунт"); window.location.href = 'Main.html'; return; }
            if (!selectedSize) { alert("Выберите размер"); return; }
            const quantity = parseInt(document.getElementById('quantity').value);
            let cart = JSON.parse(localStorage.getItem(`cart_${currentUser.id}`) || '[]');
            const existing = cart.find(i => i.id === currentProduct.id && i.size === selectedSize);
            if (existing) existing.qty += quantity;
            else cart.push({ id: currentProduct.id, name: currentProduct.name, price: currentProduct.price, size: selectedSize, qty: quantity, image: galleryImages[0] });
            localStorage.setItem(`cart_${currentUser.id}`, JSON.stringify(cart));
            updateCartCount();
            alert("Товар добавлен в корзину!");
        }

        function updateCartCount() {
            if (currentUser) {
                let cart = JSON.parse(localStorage.getItem(`cart_${currentUser.id}`) || '[]');
                document.getElementById('cartCount').innerText = cart.reduce((s,i) => s + i.qty, 0);
            }
        }

        // Отзывы (localStorage)
        function loadReviews() {
            const productId = getProductId();
            let reviews = JSON.parse(localStorage.getItem(`reviews_${productId}`) || '[]');
            const container = document.getElementById('reviewsList');
            if (reviews.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:#999;">Пока нет отзывов. Будьте первым!</div>';
                return;
            }
            container.innerHTML = reviews.map(r => `
                <div class="review-item">
                    <div class="review-avatar">${r.name.charAt(0).toUpperCase()}</div>
                    <div class="review-content">
                        <div class="review-author">${r.name}</div>
                        <div class="review-rating">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
                        <div class="review-text">${r.text}</div>
                        <div class="review-date">${new Date(r.date).toLocaleDateString()}</div>
                    </div>
                </div>
            `).join('');
        }

        function showReviewForm() {
            if (!currentUser) { alert("Войдите в аккаунт"); window.location.href = 'Main.html'; return; }
            document.getElementById('reviewForm').style.display = 'block';
            generateStarRating();
        }

        function generateStarRating() {
            const container = document.getElementById('starRating');
            container.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('i');
                star.className = 'far fa-star star';
                star.setAttribute('data-rating', i);
                star.onclick = () => setRating(i);
                container.appendChild(star);
            }
        }

        function setRating(rating) {
            currentRating = rating;
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, idx) => {
                star.className = idx < rating ? 'fas fa-star star active' : 'far fa-star star';
            });
        }

        function submitReview() {
            const text = document.getElementById('reviewText').value.trim();
            if (currentRating === 0) { alert("Поставьте оценку"); return; }
            if (!text) { alert("Напишите отзыв"); return; }
            const productId = getProductId();
            let reviews = JSON.parse(localStorage.getItem(`reviews_${productId}`) || '[]');
            reviews.unshift({ name: currentUser.name, rating: currentRating, text: text, date: new Date().toISOString() });
            localStorage.setItem(`reviews_${productId}`, JSON.stringify(reviews));
            alert("Спасибо за отзыв!");
            document.getElementById('reviewForm').style.display = 'none';
            document.getElementById('reviewText').value = '';
            currentRating = 0;
            loadReviews();
        }

        // Проверка авторизации
        function checkAuth() {
            let user = localStorage.getItem('currentUser');
            if (user) {
                currentUser = JSON.parse(user);
                document.getElementById('userPanel').style.display = 'flex';
                if (currentUser.name === 'admin') document.getElementById('adminBtn').style.display = 'inline-flex';
                let cart = JSON.parse(localStorage.getItem(`cart_${currentUser.id}`) || '[]');
                document.getElementById('cartCount').innerText = cart.reduce((s,i) => s + i.qty, 0);
            }
        }

        function createParticles() {
            const bg = document.getElementById('bgAnimation');
            for (let i = 0; i < 60; i++) {
                const p = document.createElement('span');
                p.style.width = Math.random() * 40 + 10 + 'px';
                p.style.height = p.style.width;
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = Math.random() * 12 + 6 + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                p.style.opacity = Math.random() * 0.3 + 0.1;
                p.style.background = `radial-gradient(circle, rgba(102,126,234,0.4) 0%, rgba(118,75,162,0.2) 100%)`;
                bg.appendChild(p);
            }
        }

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('galleryModal');
            if (modal.classList.contains('show')) {
                if (e.key === 'Escape') closeGallery();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'ArrowRight') nextImage();
            }
        });

        createParticles();
        checkAuth();
        loadProduct();
    </script>
</body>
</html>
