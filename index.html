<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SoftSoul Studio - Добро пожаловать</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .bg-animation { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 1; }
        .bg-animation span { position: absolute; display: block; width: 20px; height: 20px; background: rgba(255,255,255,0.08); bottom: -150px; animation: floatUp 8s infinite; border-radius: 50%; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 10% { opacity: 0.5; } 100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; } }
        .welcome-container { position: relative; z-index: 2; text-align: center; animation: fadeInScale 1s ease; padding: 20px; }
        .greeting { font-size: 1.2rem; font-weight: 400; letter-spacing: 3px; color: rgba(255,255,255,0.7); text-transform: uppercase; margin-bottom: 30px; opacity: 0; transform: translateY(30px); animation: slideUp 0.8s ease forwards; }
        .brand-wrapper { position: relative; display: inline-block; margin: 20px 0 30px; }
        .brand-main { font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; background: linear-gradient(135deg, #e8eef4 0%, #cbd5e6 100%); background-clip: text; -webkit-background-clip: text; color: transparent; position: relative; z-index: 2; display: inline-block; }
        .brand-wrapper::before { content: "SoftSoulStudio"; position: absolute; top: 0; left: 0; width: 100%; height: 100%; font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; background: linear-gradient(120deg, #ff6b6b, #4ecdc4, #ffe66d, #ff6b6b); background-size: 300% 100%; background-clip: text; -webkit-background-clip: text; color: transparent; mix-blend-mode: overlay; pointer-events: none; animation: gradientShift 3s ease infinite; white-space: nowrap; }
        @keyframes gradientShift { 0% { background-position: 0% 50%; opacity: 0.7; } 50% { background-position: 100% 50%; opacity: 1; } 100% { background-position: 0% 50%; opacity: 0.7; } }
        .subtitle { font-size: 0.9rem; font-weight: 300; letter-spacing: 2px; color: rgba(255,255,255,0.6); margin-top: 20px; text-transform: uppercase; opacity: 0; transform: translateY(30px); animation: slideUp 0.8s ease 0.2s forwards; }
        .loader { margin-top: 50px; opacity: 0; animation: fadeIn 0.5s ease 0.4s forwards; display: flex; justify-content: center; gap: 12px; }
        .loader-dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); animation: pulse 1.4s infinite ease-in-out both; }
        .loader-dot:nth-child(1) { animation-delay: -0.32s; }
        .loader-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes pulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }
        .progress-bar-container { width: 280px; height: 2px; background: rgba(255,255,255,0.15); border-radius: 2px; margin: 30px auto 0; overflow: hidden; opacity: 0; animation: fadeIn 0.5s ease 0.5s forwards; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2, #ff6b6b); width: 0%; animation: progress 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes progress { from { width: 0%; } to { width: 100%; } }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 768px) { .greeting { font-size: 0.9rem; } .subtitle { font-size: 0.7rem; } .progress-bar-container { width: 220px; } }
    </style>
</head>
<body>
    <div class="bg-animation" id="bgAnimation"></div>
    <div class="welcome-container">
        <div class="greeting">ДОБРО ПОЖАЛОВАТЬ В</div>
        <div class="brand-wrapper"><div class="brand-main">SoftSoulStudio</div></div>
        <div class="subtitle">УНИКАЛЬНАЯ ОДЕЖДА С АВТОРСКИМИ ПРИНТАМИ</div>
        <div class="loader"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>
        <div class="progress-bar-container"><div class="progress-bar"></div></div>
    </div>
    <script>
        function createStars() {
            const bg = document.getElementById('bgAnimation');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('span');
                star.style.width = Math.random() * 30 + 5 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.animationDuration = Math.random() * 10 + 5 + 's';
                star.style.animationDelay = Math.random() * 5 + 's';
                star.style.opacity = Math.random() * 0.3 + 0.1;
                bg.appendChild(star);
            }
        }
        function redirectToMain() {
            const container = document.querySelector('.welcome-container');
            const bg = document.getElementById('bgAnimation');
            container.style.animation = 'fadeOut 0.5s ease forwards';
            bg.style.transition = 'opacity 0.5s ease';
            bg.style.opacity = '0';
            const style = document.createElement('style');
            style.textContent = `@keyframes fadeOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.95); } }`;
            document.head.appendChild(style);
            setTimeout(() => { window.location.href = 'Main.html'; }, 500);
        }
        createStars();
        setTimeout(() => redirectToMain(), 3500);
        document.body.addEventListener('click', () => redirectToMain());
        document.querySelector('.welcome-container')?.addEventListener('click', (e) => e.stopPropagation());
    </script>
</body>
</html>
