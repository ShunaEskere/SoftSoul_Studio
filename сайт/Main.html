<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SoftSoul Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63); min-height: 100vh; }
        .header { background: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; color: #667eea; cursor: pointer; }
        .btn { padding: 10px 25px; border-radius: 25px; border: none; cursor: pointer; font-weight: bold; }
        .btn-outline { background: transparent; border: 2px solid #667eea; color: #667eea; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-danger { background: #f44336; color: white; }
        .banner { background: linear-gradient(135deg, #667eea, #764ba2); padding: 80px; text-align: center; color: white; }
        .products { display: flex; gap: 20px; padding: 40px; justify-content: center; flex-wrap: wrap; }
        .product { background: white; border-radius: 15px; padding: 15px; width: 250px; text-align: center; }
        .product img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; }
        .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .popup-content { background: white; padding: 40px; border-radius: 20px; width: 350px; text-align: center; }
        .popup-content input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 10px; }
        .popup-content button { width: 100%; padding: 12px; margin-top: 10px; }
        .close { float: right; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo" onclick="location.reload()">SoftSoul Studio</div>
    <div id="authButtons">
        <button class="btn btn-outline" onclick="openPopup('loginPopup')">Вход</button>
        <button class="btn btn-primary" onclick="openPopup('registerPopup')">Регистрация</button>
    </div>
    <div id="userPanel" style="display: none;">
        <span id="userName"></span>
        <button class="btn btn-outline" onclick="logout()">Выйти</button>
        <a href="admin.html" id="adminLink" style="display: none;"><button class="btn btn-primary">Админ</button></a>
    </div>
</div>

<div class="banner">
    <h1>SOFT SOUL STUDIO</h1>
    <p>Уникальная одежда с ручной росписью</p>
    <button class="btn btn-primary">Заказать дизайн</button>
</div>

<div id="products" class="products"></div>

<!-- Попап входа -->
<div id="loginPopup" class="popup">
    <div class="popup-content">
        <span class="close" onclick="closePopup('loginPopup')">&times;</span>
        <h3>Вход</h3>
        <input type="text" id="loginName" placeholder="Имя или Email">
        <input type="password" id="loginPassword" placeholder="Пароль">
        <button class="btn btn-primary" onclick="login()">Войти</button>
    </div>
</div>

<!-- Попап регистрации -->
<div id="registerPopup" class="popup">
    <div class="popup-content">
        <span class="close" onclick="closePopup('registerPopup')">&times;</span>
        <h3>Регистрация</h3>
        <input type="text" id="regName" placeholder="Имя">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPassword" placeholder="Пароль">
        <button class="btn btn-primary" onclick="register()">Зарегистрироваться</button>
    </div>
</div>

<script>
    // Товары
    const products = [
        { id: 1, name: "Awax Demon Friend Hoodie", price: 5000, image: "https://placehold.co/250x200?text=Hoodie" },
        { id: 2, name: "Evil Eye Skeleton Hoodie", price: 6000, image: "https://placehold.co/250x200?text=Hoodie2" }
    ];

    // Показать товары
    function displayProducts() {
        const container = document.getElementById('products');
        container.innerHTML = '';
        products.forEach(p => {
            container.innerHTML += `
                <div class="product">
                    <img src="${p.image}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <p>${p.price} руб.</p>
                    <button class="btn btn-primary" onclick="addToCart(${p.id})">В корзину</button>
                </div>
            `;
        });
    }

    // Корзина (localStorage)
    function addToCart(productId) {
        let user = localStorage.getItem('currentUser');
        if (!user) { alert("Войдите в аккаунт"); openPopup('loginPopup'); return; }
        let userId = JSON.parse(user).id;
        let cart = JSON.parse(localStorage.getItem('cart_' + userId) || '[]');
        let item = cart.find(i => i.id === productId);
        if (item) item.qty++;
        else cart.push({ id: productId, qty: 1 });
        localStorage.setItem('cart_' + userId, JSON.stringify(cart));
        alert("Товар добавлен в корзину!");
    }

    // Регистрация
    function register() {
        let name = document.getElementById('regName').value.trim();
        let email = document.getElementById('regEmail').value.trim();
        let password = document.getElementById('regPassword').value;
        if (!name || !email || !password) { alert("Заполните все поля"); return; }
        
        let users = JSON.parse(localStorage.getItem('allUsers') || '[]');
        if (users.find(u => u.email === email)) { alert("Email уже используется"); return; }
        
        let newUser = { id: Date.now(), name, email, password, isAdmin: name === 'admin' };
        users.push(newUser);
        localStorage.setItem('allUsers', JSON.stringify(users));
        localStorage.setItem('currentUser', JSON.stringify({ id: newUser.id, name: newUser.name, email: newUser.email }));
        alert("Регистрация успешна!");
        closePopup('registerPopup');
        location.reload();
    }

    // Вход
    function login() {
        let loginValue = document.getElementById('loginName').value.trim();
        let password = document.getElementById('loginPassword').value;
        let users = JSON.parse(localStorage.getItem('allUsers') || '[]');
        let user = users.find(u => (u.name === loginValue || u.email === loginValue) && u.password === password);
        if (!user) { alert("Неверный логин или пароль"); return; }
        localStorage.setItem('currentUser', JSON.stringify({ id: user.id, name: user.name, email: user.email }));
        alert("Добро пожаловать, " + user.name);
        closePopup('loginPopup');
        location.reload();
    }

    // Выход
    function logout() {
        localStorage.removeItem('currentUser');
        location.reload();
    }

    // Проверка авторизации
    function checkAuth() {
        let user = localStorage.getItem('currentUser');
        if (user) {
            let userData = JSON.parse(user);
            document.getElementById('authButtons').style.display = 'none';
            document.getElementById('userPanel').style.display = 'flex';
            document.getElementById('userName').innerText = userData.name;
            if (userData.name === 'admin') {
                document.getElementById('adminLink').style.display = 'inline';
            }
        }
    }

    // Попапы
    function openPopup(id) { document.getElementById(id).style.display = 'flex'; }
    function closePopup(id) { document.getElementById(id).style.display = 'none'; }

    displayProducts();
    checkAuth();
</script>
</body>
</html>
