<!DOCTYPE html>
<html lang="ru">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoftSoul Studio - Товар</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', 'Inter', sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; pointer-events: none; }
        .bg-animation span { position: absolute; display: block; width: 20px; height: 20px; background: rgba(255,255,255,0.08); bottom: -150px; animation: floatUp 8s infinite; border-radius: 50%; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 10% { opacity: 0.5; } 100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; } }
        .modern-header { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo img { height: 50px; cursor: pointer; }
        .back-button { color: #667eea; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .user-panel { display: flex; gap: 20px; align-items: center; }
        .user-icon, .cart-icon, .favorite-icon { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; position: relative; }
        .favorite-icon { background: linear-gradient(135deg, #ff6b6b, #ff8e8e); }
        .cart-count, .favorite-count { position: absolute; top: -8px; right: -8px; background: #ff6b6b; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        .admin-btn { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #f44336, #d32f2f); color: white; padding: 8px 20px; border-radius: 30px; text-decoration: none; font-size: 14px; margin-left: 10px; }
        .product-container { max-width: 1200px; margin: 50px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 50px; background: white; border-radius: 20px; overflow: hidden; position: relative; z-index: 1; }
        .product-gallery { padding: 30px; background: #f9f9f9; display: flex; flex-direction: column; align-items: center; position: relative; }
        .main-image { width: 100%; max-width: 400px; height: 400px; object-fit: contain; border-radius: 15px; margin-bottom: 20px; background: white; padding: 20px; cursor: pointer; }
        .thumbnail-list { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .thumbnail { width: 70px; height: 70px; object-fit: contain; border-radius: 10px; cursor: pointer; border: 2px solid transparent; background: white; padding: 5px; }
        .thumbnail.active { border-color: #667eea; }
        .product-info { padding: 30px; }
        .product-title { font-size: 32px; color: #333; margin-bottom: 15px; }
        .product-price { font-size: 28px; font-weight: bold; color: #667eea; margin-bottom: 20px; }
        .product-description { color: #666; line-height: 1.6; margin-bottom: 30px; }
        .size-selector { margin-bottom: 30px; }
        .size-title { font-weight: 600; margin-bottom: 10px; color: #333; }
        .size-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .size-btn { width: 50px; height: 50px; border: 2px solid #e0e0e0; background: white; border-radius: 10px; cursor: pointer; font-weight: 600; }
        .size-btn.active { border-color: #667eea; background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .quantity-selector { margin-bottom: 30px; }
        .quantity-title { font-weight: 600; margin-bottom: 10px; color: #333; }
        .quantity-control { display: flex; align-items: center; gap: 15px; }
        .quantity-btn { width: 40px; height: 40px; border: 2px solid #e0e0e0; background: white; border-radius: 10px; cursor: pointer; font-size: 18px; }
        .quantity-input { width: 60px; height: 40px; text-align: center; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
        .add-to-cart-btn { width: 100%; padding: 15px; font-size: 18px; }
        .size-price-info { font-size: 14px; color: #999; margin-top: 5px; }
        
        /* Модальная галерея */
        .gallery-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; justify-content: center; align-items: center; }
        .gallery-modal.show { display: flex; }
        .gallery-image { max-width: 90%; max-height: 90%; object-fit: contain; }
        .close-gallery { position: absolute; top: 20px; right: 35px; color: white; font-size: 40px; cursor: pointer; }
        .gallery-nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 50px; color: white; cursor: pointer; padding: 20px; user-select: none; background: rgba(0,0,0,0.5); border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; }
        .gallery-nav.prev { left: 20px; }
        .gallery-nav.next { right: 20px; }
        .gallery-nav:hover { background: rgba(0,0,0,0.8); }
        
        @media (max-width: 768px) {
            .product-container { grid-template-columns: 1fr; margin: 20px; }
            .gallery-nav { width: 40px; height: 40px; font-size: 30px; }
        }
    </style>
</head>
<body>
    <script>
    const user = localStorage.getItem('currentUser');
    if (user) {
        const userData = JSON.parse(user);
        const isAdmin = userData.name === 'admin';
        const adminBtn = document.getElementById('adminBtn');
        if (adminBtn) adminBtn.style.display = isAdmin ? 'inline-flex' : 'none';
    } else {
        const adminBtn = document.getElementById('adminBtn');
        if (adminBtn) adminBtn.style.display = 'none';
    }
</script>
    <div class="bg-animation" id="bgAnimation"></div>
    <header class="modern-header">
        <div class="logo" onclick="window.location.href='Main.html'"><img src="images/Лого VIBE.png" alt="SoftSoul Studio"></div>
        <a href="Main.html" class="back-button"><i class="fas fa-arrow-left"></i> На главную</a>
        <div class="user-panel" id="userPanel">
            <div class="user-icon" onclick="window.location.href='profile.html'"><i class="fas fa-user"></i></div>
            <div class="cart-icon" onclick="window.location.href='cart.html'"><i class="fas fa-shopping-bag"></i><span class="cart-count" id="cartCount">0</span></div>
            <div class="favorite-icon" onclick="window.location.href='profile.html?tab=favorites'"><i class="fas fa-heart"></i><span class="favorite-count" id="favoriteCount">0</span></div>
            <a href="admin.html" class="admin-btn" id="adminBtn"><i class="fas fa-cog"></i> Админ панель</a>
        </div>
    </header>
    <div class="product-container">
        <div class="product-gallery">
            <img id="mainImage" class="main-image" src="">
            <div class="thumbnail-list" id="thumbnailList"></div>
        </div>
        <div class="product-info">
            <h1 id="productTitle" class="product-title"></h1>
            <div class="price-container"><div id="productPrice" class="product-price"></div><div id="sizePriceInfo" class="size-price-info"></div></div>
            <p id="productDescription" class="product-description"></p>
            <div class="size-selector"><div class="size-title">Выберите размер:</div><div class="size-buttons" id="sizeButtons"></div></div>
            <div class="quantity-selector"><div class="quantity-title">Количество:</div><div class="quantity-control"><button class="quantity-btn" onclick="changeQuantity(-1)">-</button><input type="number" id="quantity" class="quantity-input" value="1" min="1" max="99"><button class="quantity-btn" onclick="changeQuantity(1)">+</button></div></div>
            <button class="modern-btn primary add-to-cart-btn" onclick="addToCart()"><i class="fas fa-shopping-bag"></i> Добавить в корзину</button>
        </div>
    </div>
    
    <!-- Модальная галерея -->
    <div id="galleryModal" class="gallery-modal">
        <span class="close-gallery" onclick="closeGallery()">&times;</span>
        <div class="gallery-nav prev" onclick="prevImage()">&#10094;</div>
        <img id="galleryImage" class="gallery-image" src="">
        <div class="gallery-nav next" onclick="nextImage()">&#10095;</div>
    </div>

    <script>
        let currentProduct = null;
        let selectedSize = null;
        let currentUser = null;
        let galleryImages = [];
        let currentGalleryIndex = 0;
        let basePrice = 0;
        let sizePrices = {};

        debugger;

        function getProductId() { return new URLSearchParams(window.location.search).get('id'); }

        async function loadProduct() {
            const productId = getProductId();
            if (!productId) { window.location.href = 'Main.html'; return; }
            try {
                const response = await fetch(`php/get_product.php?id=${productId}`);
                const data = await response.json();
                if (data.success && data.product) {
                    currentProduct = data.product;
                    basePrice = currentProduct.price;
                    sizePrices = currentProduct.size_prices || {};
                    displayProduct();
                } else { window.location.href = '404.html'; }
            } catch(e) { console.error(e); window.location.href = '404.html'; }
        }

        function displayProduct() {
            document.getElementById('productTitle').textContent = currentProduct.name;
            updatePriceDisplay();
            document.getElementById('productDescription').textContent = currentProduct.description || 'Описание отсутствует';
            
            // Собираем все изображения в массив
            galleryImages = [];
            if (currentProduct.image_front) galleryImages.push(currentProduct.image_front);
            if (currentProduct.image_back) galleryImages.push(currentProduct.image_back);
            if (currentProduct.image_model_front) galleryImages.push(currentProduct.image_model_front);
            if (currentProduct.image_model_back) galleryImages.push(currentProduct.image_model_back);
            if (galleryImages.length === 0) galleryImages.push('images/placeholder.jpg');
            
            // Главное изображение
            const mainImage = document.getElementById('mainImage');
            mainImage.src = galleryImages[0];
            mainImage.onclick = () => openGallery(0);
            
            // Миниатюры
            const thumbnailList = document.getElementById('thumbnailList');
            thumbnailList.innerHTML = '';
            for (let i = 0; i < galleryImages.length; i++) {
                const thumb = document.createElement('img');
                thumb.src = galleryImages[i];
                thumb.className = 'thumbnail';
                if (i === 0) thumb.classList.add('active');
                thumb.onclick = (function(idx) { return function() { changeImage(idx); }; })(i);
                thumbnailList.appendChild(thumb);
            }
            
            // Размеры
            let sizes = [];
            if (currentProduct.sizes) sizes = currentProduct.sizes.split(',').map(s => s.trim());
            else sizes = ['XS', 'S', 'M', 'L', 'XL', 'XXL'];
            const container = document.getElementById('sizeButtons');
            container.innerHTML = '';
            for (let i = 0; i < sizes.length; i++) {
                const btn = document.createElement('button');
                btn.textContent = sizes[i];
                btn.className = 'size-btn';
                btn.onclick = (function(size) { return function() { selectSize(size, this); }; })(sizes[i]);
                container.appendChild(btn);
            }
        }

        function changeImage(index) {
            currentGalleryIndex = index;
            document.getElementById('mainImage').src = galleryImages[index];
            const thumbs = document.querySelectorAll('.thumbnail');
            for (let i = 0; i < thumbs.length; i++) {
                if (i === index) thumbs[i].classList.add('active');
                else thumbs[i].classList.remove('active');
            }
        }

        function openGallery(index) {
            currentGalleryIndex = index;
            document.getElementById('galleryImage').src = galleryImages[index];
            document.getElementById('galleryModal').classList.add('show');
        }

        function closeGallery() { document.getElementById('galleryModal').classList.remove('show'); }
        function prevImage() { currentGalleryIndex = (currentGalleryIndex - 1 + galleryImages.length) % galleryImages.length; document.getElementById('galleryImage').src = galleryImages[currentGalleryIndex]; }
        function nextImage() { currentGalleryIndex = (currentGalleryIndex + 1) % galleryImages.length; document.getElementById('galleryImage').src = galleryImages[currentGalleryIndex]; }

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('galleryModal');
            if (modal.classList.contains('show')) {
                if (e.key === 'Escape') closeGallery();
                if (e.key === 'ArrowLeft') prevImage();
                if (e.key === 'ArrowRight') nextImage();
            }
        });

        function formatPrice(price) { return Number(price).toLocaleString('ru-RU') + ' руб.'; }
        function getCurrentPrice() { return (selectedSize && sizePrices[selectedSize]) ? sizePrices[selectedSize] : basePrice; }
        function updatePriceDisplay() {
            const currentPrice = getCurrentPrice();
            document.getElementById('productPrice').textContent = formatPrice(currentPrice);
            const info = document.getElementById('sizePriceInfo');
            if (selectedSize && sizePrices[selectedSize] && sizePrices[selectedSize] !== basePrice) {
                const diff = sizePrices[selectedSize] - basePrice;
                info.textContent = `Цена для размера ${selectedSize}: ${diff > 0 ? '+' : ''}${diff} руб. от базовой`;
            } else { info.textContent = ''; }
        }
        function selectSize(size, btn) {
            selectedSize = size;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updatePriceDisplay();
        }
        function changeQuantity(delta) {
            const input = document.getElementById('quantity');
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            if (val > 99) val = 99;
            input.value = val;
        }
        function addToCart() {
            if (!currentUser) { alert('Войдите в аккаунт'); window.location.href = 'Main.html'; return; }
            if (!selectedSize) { alert('Выберите размер'); return; }
            const quantity = parseInt(document.getElementById('quantity').value);
            const currentPrice = getCurrentPrice();
            let cart = JSON.parse(localStorage.getItem('cart_' + currentUser.id) || '[]');
            const idx = cart.findIndex(i => i.id === currentProduct.id && i.size === selectedSize);
            if (idx !== -1) cart[idx].quantity += quantity;
            else cart.push({ id: currentProduct.id, name: currentProduct.name, price: currentPrice, size: selectedSize, quantity: quantity, image: galleryImages[0] });
            localStorage.setItem('cart_' + currentUser.id, JSON.stringify(cart));
            updateCartCount();
            alert('Товар добавлен в корзину!');
        }
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart_' + (currentUser?.id || 'guest')) || '[]');
            const count = cart.reduce((s, i) => s + i.quantity, 0);
            const cc = document.getElementById('cartCount');
            if (cc) cc.textContent = count;
        }
        function checkAuth() {
            const user = localStorage.getItem('currentUser');
            if (user) {
                currentUser = JSON.parse(user);
                updateCartCount();
                const fav = JSON.parse(localStorage.getItem('favorites_' + currentUser.id) || '[]');
                const fc = document.getElementById('favoriteCount');
                if (fc) fc.textContent = fav.length;
            }
        }
        function createParticles() {
            const container = document.getElementById('bgAnimation');
            for (let i = 0; i < 60; i++) {
                const p = document.createElement('span');
                p.style.width = Math.random() * 40 + 10 + 'px';
                p.style.height = p.style.width;
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = Math.random() * 12 + 6 + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                p.style.opacity = Math.random() * 0.3 + 0.1;
                p.style.background = 'radial-gradient(circle, rgba(102,126,234,0.4) 0%, rgba(118,75,162,0.2) 100%)';
                container.appendChild(p);
            }
            function addToCart() {
    if (!currentUser) {
        alert('Войдите в аккаунт');
        window.location.href = 'Main.html';
        return;
    }
    if (!selectedSize) {
        alert('Выберите размер');
        return;
    }
    
    const quantity = parseInt(document.getElementById('quantity').value);
    const currentPrice = getCurrentPrice();
    
    let cart = JSON.parse(localStorage.getItem(`cart_${currentUser.id}`) || '[]');
    
    const idx = cart.findIndex(item => item.id === currentProduct.id && item.size === selectedSize);
    if (idx !== -1) {
        cart[idx].quantity += quantity;
    } else {
        cart.push({
            id: currentProduct.id,
            name: currentProduct.name,
            price: currentPrice,
            size: selectedSize,
            quantity: quantity,
            image: galleryImages[0] || 'images/placeholder.jpg'
        });
    }
    
    localStorage.setItem(`cart_${currentUser.id}`, JSON.stringify(cart));
    updateCartCount();
    alert('Товар добавлен в корзину!');
}

function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem(`cart_${currentUser?.id}`) || '[]');
    const count = cart.reduce((s, i) => s + i.quantity, 0);
    const cartCount = document.getElementById('cartCount');
    if (cartCount) cartCount.textContent = count;
}
        }
        createParticles();
        checkAuth();
        loadProduct();
    </script>
</body>
</html>
