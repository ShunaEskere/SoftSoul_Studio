<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SoftSoul Studio - Корзина</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', 'Inter', sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; pointer-events: none; }
        .bg-animation span { position: absolute; display: block; width: 20px; height: 20px; background: rgba(255,255,255,0.08); bottom: -150px; animation: floatUp 8s infinite; border-radius: 50%; }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 10% { opacity: 0.5; } 100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; } }
        .modern-header { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo img { height: 50px; cursor: pointer; transition: transform 0.3s; }
        .logo img:hover { transform: scale(1.05); }
        .back-button { color: #667eea; text-decoration: none; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .back-button:hover { color: #764ba2; }
        .user-panel { display: flex; gap: 20px; align-items: center; }
        .user-icon, .cart-icon, .favorite-icon { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.3s; color: white; font-size: 18px; position: relative; }
        .favorite-icon { background: linear-gradient(135deg, #ff6b6b, #ff8e8e); }
        .user-icon:hover, .cart-icon:hover, .favorite-icon:hover { transform: scale(1.1); }
        .cart-count, .favorite-count { position: absolute; top: -8px; right: -8px; background: #ff6b6b; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        /* Админ-кнопка ПО УМОЛЧАНИЮ СКРЫТА */
        .admin-btn { display: none !important; }
        .cart-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 1; }
        .cart-title { color: white; font-size: 32px; margin-bottom: 30px; text-align: center; }
        .cart-content { display: grid; grid-template-columns: 1fr 350px; gap: 30px; }
        .cart-items { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 20px; min-height: 400px; }
        .cart-item { display: flex; gap: 20px; padding: 20px 0; border-bottom: 1px solid #e0e0e0; }
        .cart-item-image { width: 100px; height: 100px; border-radius: 12px; overflow: hidden; flex-shrink: 0; }
        .cart-item-image img { width: 100%; height: 100%; object-fit: cover; }
        .cart-item-details { flex: 1; }
        .cart-item-name { font-size: 16px; font-weight: 600; color: #333; }
        .cart-item-size { font-size: 13px; color: #666; margin: 5px 0; }
        .cart-item-price { font-size: 14px; color: #667eea; font-weight: 500; }
        .cart-item-actions { display: flex; align-items: center; gap: 15px; }
        .quantity-control { display: flex; align-items: center; gap: 8px; }
        .quantity-btn { width: 30px; height: 30px; border: 1px solid #e0e0e0; background: white; border-radius: 8px; cursor: pointer; }
        .quantity-input { width: 45px; height: 30px; text-align: center; border: 1px solid #e0e0e0; border-radius: 8px; }
        .remove-item { background: none; border: none; color: #f44336; cursor: pointer; font-size: 18px; }
        .cart-item-total { font-weight: bold; color: #333; min-width: 100px; text-align: right; }
        .cart-summary { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 25px; height: fit-content; position: sticky; top: 100px; }
        .cart-summary h3 { font-size: 20px; color: #333; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #f0f0f0; }
        .summary-row { display: flex; justify-content: space-between; padding: 12px 0; color: #666; }
        .summary-total { display: flex; justify-content: space-between; padding: 15px 0; border-top: 2px solid #f0f0f0; margin-top: 10px; font-weight: bold; font-size: 18px; color: #333; }
        .checkout-btn { width: 100%; margin-top: 20px; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; }
        .empty-cart { text-align: center; padding: 80px 20px; background: rgba(255,255,255,0.95); border-radius: 20px; }
        .empty-cart i { font-size: 80px; color: #ccc; margin-bottom: 20px; }
        .empty-cart h3 { font-size: 24px; color: #333; margin-bottom: 10px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 2000; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: white; border-radius: 20px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 25px; border-bottom: 1px solid #e0e0e0; }
        .modal-header h3 { color: #333; font-size: 20px; }
        .close-modal { background: none; border: none; font-size: 28px; cursor: pointer; color: #999; }
        .modal-body { padding: 25px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; }
        .order-summary { background: #f9f9f9; border-radius: 12px; padding: 15px; margin: 20px 0; }
        .step-buttons { display: flex; gap: 15px; justify-content: space-between; margin-top: 20px; }
        .btn-back, .btn-next, .btn-submit { padding: 12px 25px; border-radius: 30px; font-weight: 600; cursor: pointer; border: none; }
        .btn-back { background: #f0f0f0; color: #666; }
        .btn-next, .btn-submit { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .step-content { display: none; }
        .step-content.active { display: block; }
        .custom-toast { position: fixed; bottom: 30px; right: 30px; z-index: 10000; animation: slideInRight 0.3s ease; }
        .toast-content { background: white; border-radius: 12px; padding: 16px 24px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); min-width: 280px; }
        .toast-content i { font-size: 20px; }
        .toast-content.success { border-left: 4px solid #4caf50; }
        .toast-content.success i { color: #4caf50; }
        .toast-content.error { border-left: 4px solid #f44336; }
        .toast-content.error i { color: #f44336; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 768px) {
            .modern-header { padding: 15px 20px; flex-wrap: wrap; gap: 10px; }
            .cart-content { grid-template-columns: 1fr; }
            .cart-item { flex-wrap: wrap; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="bg-animation" id="bgAnimation"></div>

    <header class="modern-header">
        <div class="logo" onclick="window.location.href='Main.html'"><img src="images/Лого VIBE.png" alt="SoftSoul Studio"></div>
        <a href="Main.html" class="back-button"><i class="fas fa-arrow-left"></i> Продолжить покупки</a>
        <div class="user-panel" id="userPanel">
            <div class="user-icon" onclick="window.location.href='profile.html'"><i class="fas fa-user"></i></div>
            <div class="cart-icon" onclick="window.location.href='cart.html'"><i class="fas fa-shopping-bag"></i><span class="cart-count" id="cartCount">0</span></div>
            <div class="favorite-icon" onclick="window.location.href='profile.html?tab=favorites'"><i class="fas fa-heart"></i><span class="favorite-count" id="favoriteCount">0</span></div>
            <!-- Админ-кнопка скрыта через CSS, показана только если JS её покажет -->
            <a href="admin.html" class="admin-btn" id="adminBtn"><i class="fas fa-cog"></i> Админ панель</a>
        </div>
    </header>

    <div class="cart-container">
        <h1 class="cart-title">Корзина</h1>
        <div id="cartContent" class="cart-content">
            <div id="cartItems" class="cart-items"></div>
            <div class="cart-summary">
                <h3>Итого</h3>
                <div class="summary-row"><span>Товары (<span id="itemsCount">0</span> шт.)</span><span id="subtotal">0 руб.</span></div>
                <div class="summary-row"><span>Доставка</span><span id="deliveryCost">0 руб.</span></div>
                <div class="summary-total"><span>К оплате</span><span id="totalAmount">0 руб.</span></div>
                <button class="checkout-btn" onclick="showCheckoutForm()">Оформить заказ</button>
            </div>
        </div>
        <div id="emptyCart" class="empty-cart" style="display: none;">
            <i class="fas fa-shopping-bag"></i>
            <h3>Корзина пуста</h3>
            <p>Добавьте товары в корзину, чтобы оформить заказ</p>
            <a href="Main.html#catalog" class="checkout-btn" style="display: inline-block; width: auto; padding: 12px 30px; text-decoration: none;">Перейти в каталог</a>
        </div>
    </div>

    <div id="checkoutModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-truck"></i> Оформление заказа</h3>
                <button class="close-modal" onclick="closeCheckoutForm()">×</button>
            </div>
            <div class="modal-body">
                <div id="step1" class="step-content active">
                    <div class="form-group"><input type="text" id="fullName" placeholder="ФИО" required></div>
                    <div class="form-row">
                        <div class="form-group"><input type="tel" id="phone" placeholder="Телефон" required></div>
                        <div class="form-group"><input type="email" id="email" placeholder="Email" required></div>
                    </div>
                    <div class="form-group">
                        <select id="deliveryMethod">
                            <option value="courier">Курьером (300 руб.)</option>
                            <option value="pickup">Самовывоз (бесплатно)</option>
                            <option value="post">Почта России (200 руб.)</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><input type="text" id="city" placeholder="Город" required></div>
                        <div class="form-group"><input type="text" id="address" placeholder="Адрес" required></div>
                    </div>
                    <div class="form-group"><input type="text" id="comment" placeholder="Комментарий к заказу"></div>
                    <div class="step-buttons"><button class="btn-next" onclick="goToStep(2)">Далее →</button></div>
                </div>
                <div id="step2" class="step-content">
                    <div class="order-summary">
                        <p>Товары: <span id="orderItemsCount">0</span> шт. — <span id="orderSubtotal">0</span> руб.</p>
                        <p>Доставка: <span id="orderDelivery">0</span> руб.</p>
                        <p class="total"><strong>Итого: <span id="orderTotal">0</span> руб.</strong></p>
                    </div>
                    <div class="step-buttons">
                        <button class="btn-back" onclick="goToStep(1)">← Назад</button>
                        <button class="btn-next" onclick="goToStep(3)">Далее →</button>
                    </div>
                </div>
                <div id="step3" class="step-content">
                    <div id="orderSummary" class="order-summary"></div>
                    <div class="step-buttons">
                        <button class="btn-back" onclick="goToStep(2)">← Назад</button>
                        <button class="btn-submit" onclick="submitOrder()">Подтвердить заказ</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let cart = [];
        let deliveryPrices = { courier: 300, pickup: 0, post: 200 };

        function createParticles() {
            const container = document.getElementById('bgAnimation');
            for (let i = 0; i < 60; i++) {
                const p = document.createElement('span');
                p.style.width = Math.random() * 40 + 10 + 'px';
                p.style.height = p.style.width;
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = Math.random() * 12 + 6 + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                p.style.opacity = Math.random() * 0.3 + 0.1;
                p.style.background = 'radial-gradient(circle, rgba(102,126,234,0.4) 0%, rgba(118,75,162,0.2) 100%)';
                container.appendChild(p);
            }
        }

        function showToast(message, type) {
            const existing = document.querySelector('.custom-toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'custom-toast';
            let icon = type === 'success' ? '<i class="fas fa-check-circle"></i>' : type === 'error' ? '<i class="fas fa-exclamation-circle"></i>' : '<i class="fas fa-info-circle"></i>';
            toast.innerHTML = `<div class="toast-content ${type}">${icon}<div class="toast-message">${message}</div></div>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function getCartKey() { return currentUser ? `cart_${currentUser.id}` : 'cart_guest'; }

        function loadCart() {
            const saved = localStorage.getItem(getCartKey());
            cart = saved ? JSON.parse(saved) : [];
            displayCart();
        }

        function saveCart() { localStorage.setItem(getCartKey(), JSON.stringify(cart)); }

        function displayCart() {
            const container = document.getElementById('cartItems');
            const cartContent = document.getElementById('cartContent');
            const emptyCart = document.getElementById('emptyCart');
            if (!cart || cart.length === 0) {
                if (cartContent) cartContent.style.display = 'none';
                if (emptyCart) emptyCart.style.display = 'block';
                return;
            }
            if (cartContent) cartContent.style.display = 'grid';
            if (emptyCart) emptyCart.style.display = 'none';
            if (!container) return;
            container.innerHTML = '';
            let subtotal = 0;
            for (let i = 0; i < cart.length; i++) {
                const item = cart[i];
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                container.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-image"><img src="${item.image || 'images/placeholder.jpg'}"></div>
                        <div class="cart-item-details">
                            <div class="cart-item-name">${escapeHtml(item.name)}</div>
                            <div class="cart-item-size">Размер: ${item.size || 'не выбран'}</div>
                            <div class="cart-item-price">${Number(item.price).toLocaleString()} руб.</div>
                        </div>
                        <div class="cart-item-actions">
                            <div class="quantity-control">
                                <button class="quantity-btn" onclick="updateQuantity(${i}, -1)">-</button>
                                <input type="number" class="quantity-input" value="${item.quantity}" min="1" max="99" onchange="updateQuantity(${i}, 0, this.value)">
                                <button class="quantity-btn" onclick="updateQuantity(${i}, 1)">+</button>
                            </div>
                            <button class="remove-item" onclick="removeFromCart(${i})"><i class="fas fa-trash-alt"></i></button>
                        </div>
                        <div class="cart-item-total">${Number(itemTotal).toLocaleString()} руб.</div>
                    </div>
                `;
            }
            document.getElementById('itemsCount').textContent = cart.reduce((s, i) => s + i.quantity, 0);
            document.getElementById('subtotal').textContent = subtotal.toLocaleString() + ' руб.';
            document.getElementById('deliveryCost').textContent = '0 руб.';
            document.getElementById('totalAmount').textContent = subtotal.toLocaleString() + ' руб.';
        }

        function updateQuantity(index, delta, newVal) {
            if (delta !== 0) {
                let q = cart[index].quantity + delta;
                if (q < 1) q = 1;
                if (q > 99) q = 99;
                cart[index].quantity = q;
            } else if (newVal) {
                let q = parseInt(newVal);
                if (isNaN(q)) q = 1;
                if (q < 1) q = 1;
                if (q > 99) q = 99;
                cart[index].quantity = q;
            }
            saveCart();
            displayCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            displayCart();
            showToast('Товар удален', 'info');
        }

        function updateOrderSummary() {
            const subtotal = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
            const delivery = deliveryPrices[document.getElementById('deliveryMethod').value];
            const total = subtotal + delivery;
            document.getElementById('orderItemsCount').textContent = cart.reduce((s, i) => s + i.quantity, 0);
            document.getElementById('orderSubtotal').textContent = subtotal.toLocaleString();
            document.getElementById('orderDelivery').textContent = delivery.toLocaleString();
            document.getElementById('orderTotal').textContent = total.toLocaleString();
        }

        function goToStep(step) {
            document.querySelectorAll('.step-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`step${step}`).classList.add('active');
            if (step === 3) {
                const subtotal = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
                const delivery = deliveryPrices[document.getElementById('deliveryMethod').value];
                const total = subtotal + delivery;
                document.getElementById('orderSummary').innerHTML = `
                    <p><strong>Получатель:</strong> ${escapeHtml(document.getElementById('fullName').value)}</p>
                    <p><strong>Телефон:</strong> ${escapeHtml(document.getElementById('phone').value)}</p>
                    <p><strong>Адрес:</strong> ${escapeHtml(document.getElementById('city').value)}, ${escapeHtml(document.getElementById('address').value)}</p>
                    <div><strong>Товары:</strong></div>
                    ${cart.map(item => `<div>${escapeHtml(item.name)} (${item.size}) - ${item.quantity} шт. × ${item.price} руб.</div>`).join('')}
                    <p><strong>Итого: ${total.toLocaleString()} руб.</strong></p>
                `;
            }
        }

        function showCheckoutForm() {
            if (!currentUser) { showToast('Войдите в аккаунт', 'error'); window.location.href = 'Main.html'; return; }
            if (cart.length === 0) { showToast('Корзина пуста', 'error'); return; }
            document.getElementById('fullName').value = currentUser.name || '';
            document.getElementById('email').value = currentUser.email || '';
            updateOrderSummary();
            goToStep(1);
            document.getElementById('checkoutModal').classList.add('show');
        }

        function closeCheckoutForm() { document.getElementById('checkoutModal').classList.remove('show'); }

        async function submitOrder() {
            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const deliveryMethod = document.getElementById('deliveryMethod').value;
            const city = document.getElementById('city').value.trim();
            const address = document.getElementById('address').value.trim();
            const comment = document.getElementById('comment').value.trim();
            
            if (!fullName || !phone || !email || !city || !address) {
                showToast('Заполните все поля', 'error');
                goToStep(1);
                return;
            }
            
            const subtotal = cart.reduce((s, i) => s + (i.price * i.quantity), 0);
            const delivery = deliveryPrices[deliveryMethod];
            const total = subtotal + delivery;
            
            try {
                const response = await fetch('php/create_order.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUser.id, userName: currentUser.name, userEmail: currentUser.email, fullName, phone, email, deliveryMethod, deliveryPrice: delivery, city, address, comment, items: cart, subtotal, total })
                });
                const data = await response.json();
                if (data.success) {
                    cart = [];
                    saveCart();
                    closeCheckoutForm();
                    showToast('Заказ оформлен!', 'success');
                    setTimeout(() => displayCart(), 1000);
                } else { showToast(data.message || 'Ошибка', 'error'); }
            } catch (error) { showToast('Ошибка сервера', 'error'); }
        }

        function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

        // ========== ПРОВЕРКА АВТОРИЗАЦИИ ==========
        function checkAuth() {
            const user = localStorage.getItem('currentUser');
            const adminBtn = document.getElementById('adminBtn');
            
            if (user) {
                try {
                    currentUser = JSON.parse(user);
                    // Админ-кнопка показывается ТОЛЬКО если имя пользователя "admin"
                    if (adminBtn) {
                        adminBtn.style.display = currentUser.name === 'admin' ? 'inline-flex' : 'none';
                    }
                    loadCart();
                    // Загружаем количество избранного
                    const favorites = JSON.parse(localStorage.getItem(`favorites_${currentUser.id}`) || '[]');
                    const favCount = document.getElementById('favoriteCount');
                    if (favCount) favCount.textContent = favorites.length;
                    // Обновляем счетчик корзины
                    const cartCount = document.getElementById('cartCount');
                    if (cartCount) cartCount.textContent = cart.reduce((s, i) => s + i.quantity, 0);
                } catch(e) {
                    console.error('Ошибка:', e);
                    if (adminBtn) adminBtn.style.display = 'none';
                }
            } else {
                if (adminBtn) adminBtn.style.display = 'none';
                // Если не авторизован - перенаправляем на главную
                window.location.href = 'Main.html';
            }
        }

        createParticles();
        checkAuth();
    </script>
</body>
</html>
