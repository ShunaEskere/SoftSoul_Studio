<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Админ панель</title></head>
<body style="font-family:Arial; padding:40px; background:#f0f0f0;">
    <h1>Админ панель</h1>
    <h2>Пользователи</h2>
    <div id="usersList"></div>
    <br><a href="Main.html">На главную</a>
    <script>
        let users = JSON.parse(localStorage.getItem('allUsers') || '[]');
        let html = '<ul>';
        users.forEach(u => { html += `<li>${u.name} (${u.email}) ${u.isAdmin ? '👑 Админ' : ''}</li>`; });
        html += '</ul>';
        document.getElementById('usersList').innerHTML = html;
    </script>
</body>
</html>
