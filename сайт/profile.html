<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="modern-header"><div class="logo" onclick="location.href='Main.html'">SoftSoul Studio</div></header>
    <div class="profile-container" style="max-width:800px; margin:50px auto; background:white; padding:30px; border-radius:20px;">
        <h2>Профиль</h2>
        <p><strong>Имя:</strong> <span id="profName"></span></p>
        <p><strong>Email:</strong> <span id="profEmail"></span></p>
        <button onclick="logout()">Выйти</button>
        <button onclick="deleteAccount()" style="background:#f44336; color:white;">Удалить аккаунт</button>
    </div>
    <script>
        let user = localStorage.getItem('currentUser');
        if (!user) location.href = 'Main.html';
        let u = JSON.parse(user);
        document.getElementById('profName').innerText = u.name;
        document.getElementById('profEmail').innerText = u.email;
        function logout() { localStorage.removeItem('currentUser'); location.href = 'Main.html'; }
        function deleteAccount() {
            if(confirm("Удалить аккаунт?")){
                let users = JSON.parse(localStorage.getItem('allUsers')||'[]');
                let newUsers = users.filter(u2 => u2.id !== u.id);
                localStorage.setItem('allUsers', JSON.stringify(newUsers));
                localStorage.removeItem('currentUser');
                localStorage.removeItem('cart_'+u.id);
                localStorage.removeItem('fav_'+u.id);
                alert("Аккаунт удалён");
                location.href='Main.html';
            }
        }
    </script>
</body>
</html>
